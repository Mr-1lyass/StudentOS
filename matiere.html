<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matière</title>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body class="bodyCenter">
    <a href="./index.html" class="backButton">Retour</a>
        <main class="mainLabel">
            <h1>Ajout d'une matière</h1>
            <label for="name">Nom : </label>
            <input type="text" id="name">
            <label for="professeur">Professeur : </label>
            <input type="text" id="professeur">
            <label for="genre">Genre : </label>
            <select id="genre">
                <option value="Mr">Mr</option>
                <option value="Mme">Mme</option>
            </select>
            <button class="addButton">Ajouter</button>
        </main> 
        <p class="message"></p>
        <h2 style="display:none">Ensemble des matières<h2>
        <div id="sectionMatiere"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./scripts/config.js"></script>
    <script type="module" src="./scripts/matiere.js"></script>
</body>

</html>
