<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Calendrier</title>
</head>

<body id="bodyCalendrier">
        <a href="./index.html" class="backButton">Retour</a>
        <div class="calendrier">
            <div class="header">
                <div id="prev" class="btnCalendrier"><i class="fa-solid fa-arrow-left"></i></div>
                <div id="month-year"></div>
                <div id="next" class="btnCalendrier"><i class="fa-solid fa-arrow-right"></i></div>
            </div>
            <div class="weekdays">
                <div>Lun</div>
                <div>Mar</div>
                <div>Mer</div>
                <div>Jeu</div>
                <div>Ven</div>
                <div>Sam</div>
                <div>Dim</div>
            </div>
            <div class="days" id="days"></div>
        </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./scripts/config.js"></script>
    <script type="module" src="./scripts/calendrier.js"></script>
</body>

</html>
