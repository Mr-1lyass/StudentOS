<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <title>Créer un compte</title>
</head>
<body class="bodyCenter">
    <a href="./index.html" class="backButton">Retour</a>

    <main class="mainConnexion">
        <h1>Créer un compte</h1>
        <label for="nom">Nom : </label>
        <input type="text" id="nom">
        <label for="prenom">Prénom : </label>
        <input type="text" id="prenom">
        <label for="mail">Adresse email : </label>
        <input type="email" id="mail">
        <label for="password">Mot de passe : </label>
        <input type="password" id="password">
        <p>Vous avez déjà un compte ? <a href="./connexion.html">Connectez-vous</a></p>
        <div class="divMessage"></div>
        <button class="addButtonConnexion">Créer un compte</button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./scripts/config.js"></script>
    <script type="module" src="./scripts/creationCompte.js"></script>
</body>
</html>
